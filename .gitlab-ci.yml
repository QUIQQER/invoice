include:
  - component: $CI_SERVER_FQDN/quiqqer/stabilization/ci-cd-components/quiqqer-package-bundle/quiqqer-package-bundle@main
    inputs:
      php-82: true
      php-83: true
      php-84: true
      php-85: true

offer-tests-php8.5:
  extends: phpunit-php8.5
  before_script:
    - cd /var/www/html
    - ./console composer require --no-interaction "quiqqer/offers:^2.10.0"
    - ./console setup
    - cd "${CI_PROJECT_DIR}"
  script:
    - !reference [phpunit-php8.5, script]
    - ./tools/phpunit --filter ManualCalculationSnapshotTest --fail-on-skipped --cache-directory "${PHPUNIT_CACHE_DIRECTORY}-offers"

upgrade-tests-php8.5:
  extends: phpunit-php8.5
  script:
    - !reference [phpunit-php8.5, script]
    - ./tools/phpunit --configuration phpunit.upgrade.xml --cache-directory "${PHPUNIT_CACHE_DIRECTORY}-upgrade"
